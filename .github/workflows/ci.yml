name: 🚀 CI/CD - PickCourt FE

on:
  push:
    branches: [main, dev, staging]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"

      - name: 📥 Install dependencies
        run: yarn install --frozen-lockfile

      - name: 🔍 Run Lint
        run: yarn lint

      - name: 🧪 Run Unit Tests
        run: yarn test

      - name: 🏗️ Build Project
        run: yarn build

      - name: 📁 Compress build output
        run: |
          tar -czf pickcourt-fe.tar.gz .next public package.json yarn.lock

      - name: 📡 Upload build to VPS
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "pickcourt-fe.tar.gz"
          target: "/root"

      - name: 🔄 SSH into VPS and deploy
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /root
            rm -rf pickcourt-fe
            mkdir -p pickcourt-fe
            tar -xzf pickcourt-fe.tar.gz -C pickcourt-fe
            cd pickcourt-fe
            pm2 restart pickcourt-fe || pm2 start npm --name "pickcourt-fe" -- start
