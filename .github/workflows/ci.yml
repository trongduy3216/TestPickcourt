name: 🚀 CI - PickCourt FE

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  ci-check:
    name: 🔍 Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"

      - name: 📥 Install dependencies
        run: yarn install --frozen-lockfile

      - name: 🔍 Run Lint
        run: yarn lint

      - name: 🧪 Run Unit Tests
        run: yarn test

      - name: 🏗️ Build Project
        run: yarn build
